name: Run Tests

on:
  push:
    branches:
    - main
    - develop

  pull_request:
    branches:
    - main
    - develop

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          pyproject.toml
    - name: Install dependencies
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python -m pip install --upgrade pip
        pip install wheel
        pip install ".[dev]"
    - name: Install pytest
      run: |
        pip install pytest pytest-cov pytest-xdist
        pip install coveralls
    - name: Test with pytest
      run: |
        coverage run --source=e3nn_jax -m pytest -n auto --doctest-modules --ignore=docs/ --ignore=tests/noxfile.py tests examples
    - name: Upload to coveralls
      if: github.event_name == 'push'
      run: |
        if [ -n "${{ secrets.COVERALLS_TOKEN }}" ]; then
          COVERALLS_REPO_TOKEN="${{ secrets.COVERALLS_TOKEN }}" coveralls
        else
          echo "Skipping coveralls upload: COVERALLS_TOKEN not set."
        fi
